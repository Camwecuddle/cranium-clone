<title>Cranium 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1EEF6; --surface:#FFFFFF; --surface-2:#E8E3F0;
  --ink:#221B2E; --ink-muted:#6B6379; --hairline:#D6CFE1;
  --on-deck:#FFFFFF;
  --shadow:0 1px 2px rgba(34,27,46,.06), 0 14px 30px -14px rgba(34,27,46,.30);
  --shadow-lift:0 2px 5px rgba(34,27,46,.09), 0 28px 50px -18px rgba(34,27,46,.36);
  --worm:#A87505; --worm-wash:#FAEFD1;
  --cat:#C93A4C;  --cat-wash:#FBE1E4;
  --data:#2A5CBE; --data-wash:#DDE6FB;
  --star:#2A8039; --star-wash:#DCEFE0;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#16121F; --surface:#221B2E; --surface-2:#2E2640;
    --ink:#F0EBF7; --ink-muted:#A198B2; --hairline:#3C3350;
    --on-deck:#16121F;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 30px -14px rgba(0,0,0,.65);
    --shadow-lift:0 2px 5px rgba(0,0,0,.5), 0 28px 50px -18px rgba(0,0,0,.75);
    --worm:#EFC352; --worm-wash:#3B2F11;
    --cat:#F27484;  --cat-wash:#3E1C22;
    --data:#83A8F5; --data-wash:#1C2946;
    --star:#6FCA7E; --star-wash:#173220;
  }
}
:root[data-theme="dark"]{
  --ground:#16121F; --surface:#221B2E; --surface-2:#2E2640;
  --ink:#F0EBF7; --ink-muted:#A198B2; --hairline:#3C3350;
  --on-deck:#16121F;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 30px -14px rgba(0,0,0,.65);
  --shadow-lift:0 2px 5px rgba(0,0,0,.5), 0 28px 50px -18px rgba(0,0,0,.75);
  --worm:#EFC352; --worm-wash:#3B2F11;
  --cat:#F27484;  --cat-wash:#3E1C22;
  --data:#83A8F5; --data-wash:#1C2946;
  --star:#6FCA7E; --star-wash:#173220;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px; margin:0 auto; padding:28px 20px 64px; display:flex; flex-direction:column; gap:22px}

/* ---- masthead ---- */
.masthead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap}
.wordmark{font-family:var(--display); font-weight:800; font-size:clamp(28px,5vw,40px); letter-spacing:-.02em; margin:0; line-height:1}
.wordmark span{
  background:linear-gradient(90deg,var(--worm) 0 25%,var(--cat) 25% 50%,var(--data) 50% 75%,var(--star) 75% 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.masthead p{margin:0; color:var(--ink-muted); font-size:14px; max-width:44ch}

/* ---- deck + activity pickers ---- */
.picker{display:flex; flex-direction:column; gap:10px}
.picker-label{
  font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-muted); font-weight:600;
}
.decks{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
@media (max-width:560px){ .decks{grid-template-columns:repeat(2,1fr)} }
.deck-btn{
  font-family:var(--display); font-weight:600; font-size:15px;
  border:1.5px solid var(--hairline); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:11px 10px; cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:9px; transition:border-color .15s, background .15s;
}
.deck-btn .pip{width:11px; height:11px; border-radius:50%; background:var(--deck); flex:none}
.deck-btn:hover{border-color:var(--deck)}
.deck-btn[aria-pressed="true"]{background:var(--deck); border-color:var(--deck); color:var(--on-deck)}
.deck-btn[aria-pressed="true"] .pip{background:var(--on-deck)}

.acts{display:flex; flex-wrap:wrap; gap:7px}
.act-btn{
  font-family:var(--body); font-weight:500; font-size:13.5px;
  border:1.5px solid var(--hairline); background:transparent; color:var(--ink-muted);
  border-radius:999px; padding:6px 14px; cursor:pointer; transition:all .15s;
}
.act-btn:hover{color:var(--ink); border-color:var(--deck)}
.act-btn[aria-pressed="true"]{background:var(--deck-wash); border-color:var(--deck); color:var(--deck); font-weight:600}

button:focus-visible, a:focus-visible{outline:2.5px solid var(--deck); outline-offset:2px}

/* ---- the card ---- */
.card{
  background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lift);
  overflow:hidden; display:flex; flex-direction:column; min-height:296px;
}
.card.dealing{animation:deal .34s cubic-bezier(.2,.75,.3,1)}
@keyframes deal{from{transform:translateY(14px) rotate(-.7deg); opacity:0} to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){ .card.dealing{animation:none} }

.card-band{
  background:var(--deck); color:var(--on-deck);
  padding:11px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.card-band .act{font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-.01em}
.card-band .of{font-size:12px; font-variant-numeric:tabular-nums; opacity:.85; font-weight:500}
.card-howto{
  padding:12px 22px; background:var(--deck-wash); color:var(--ink);
  font-size:13px; line-height:1.45; border-bottom:1px solid var(--hairline);
}
.card-body{padding:26px 22px; display:flex; flex-direction:column; gap:16px; flex:1; justify-content:center}

.eyebrow{
  font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--deck); font-weight:600;
}
.clue{
  font-family:var(--display); font-weight:600; letter-spacing:-.015em;
  font-size:clamp(24px,4.2vw,36px); line-height:1.18; margin:0; text-wrap:balance;
}
.clue.small{font-size:clamp(20px,3vw,27px)}
.puzzle{
  font-family:var(--mono); font-weight:500; font-size:clamp(19px,3.4vw,29px);
  line-height:1.5; word-break:break-word;
}
.sub{color:var(--ink-muted); font-size:15px; margin:0}

.options{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.options li{
  display:flex; gap:11px; align-items:flex-start;
  border:1.5px solid var(--hairline); border-radius:9px; padding:10px 13px;
  font-size:15.5px; line-height:1.35;
}
.options li .ltr{font-family:var(--mono); font-weight:500; color:var(--ink-muted); flex:none}
.options li.right{border-color:var(--deck); background:var(--deck-wash)}
.options li.right .ltr{color:var(--deck)}

.answer{
  border-top:1px dashed var(--hairline); padding:16px 22px 20px;
  display:flex; flex-direction:column; gap:5px;
}
.answer .eyebrow{color:var(--ink-muted)}
.answer .val{
  font-family:var(--display); font-weight:800; font-size:clamp(20px,3.4vw,28px);
  color:var(--deck); letter-spacing:-.01em; line-height:1.2;
}
.answer .val.mono{font-family:var(--mono); font-weight:500; font-size:clamp(17px,2.6vw,22px); letter-spacing:.04em}
.answer .note{color:var(--ink-muted); font-size:14px}

/* ---- controls ---- */
.controls{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.btn{
  font-family:var(--body); font-size:14.5px; font-weight:600;
  border-radius:10px; padding:11px 18px; cursor:pointer; border:1.5px solid transparent;
  transition:filter .15s, background .15s;
}
.btn-primary{background:var(--deck); color:var(--on-deck)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface); border-color:var(--hairline); color:var(--ink)}
.btn-ghost:hover{border-color:var(--deck)}
.timer{
  margin-left:auto; display:flex; align-items:center; gap:9px;
  background:var(--surface); border:1.5px solid var(--hairline); border-radius:10px; padding:7px 9px 7px 14px;
}
.timer .t{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:19px; font-weight:500; min-width:52px}
.timer.low .t{color:var(--cat)}
.timer .btn{padding:6px 12px; font-size:13px}
.hint{color:var(--ink-muted); font-size:12.5px; margin:0}
.hint kbd{
  font-family:var(--mono); font-size:11.5px; background:var(--surface-2);
  border-radius:4px; padding:1.5px 5px; border:1px solid var(--hairline);
}
footer{color:var(--ink-muted); font-size:13px; border-top:1px solid var(--hairline); padding-top:16px; line-height:1.6}
footer b{color:var(--ink); font-weight:600}
</style>

<div class="wrap">
  <header class="masthead">
    <h1 class="wordmark"><span>Cranium 2026</span></h1>
    <p>Draw a real Cranium card, read off its category, then play one of these instead. Same rules, references from this century.</p>
  </header>

  <div class="picker">
    <div class="picker-label">Deck</div>
    <div class="decks" id="decks"></div>
  </div>

  <div class="picker">
    <div class="picker-label">Card type</div>
    <div class="acts" id="acts"></div>
  </div>

  <article class="card" id="card"></article>

  <div class="controls">
    <button class="btn btn-primary" id="next">Next card</button>
    <button class="btn btn-ghost" id="reveal">Show answer</button>
    <div class="timer" id="timer">
      <span class="t" id="tval">1:00</span>
      <button class="btn btn-ghost" id="tbtn">Start</button>
    </div>
  </div>
  <p class="hint"><kbd>N</kbd> next card · <kbd>A</kbd> show answer · <kbd>T</kbd> timer</p>

  <footer id="foot"></footer>
</div>

    elCard.className = "card" + (dealt ? " dealing" : "");
    elCard.innerHTML =
      '<div class="card-band"><span class="act">' + esc(a.name) + '</span>' +
      '<span class="of">' + (bags[key] ? bags[key].length : 0) + ' left of ' + a.cards.length + '</span></div>' +
      '<div class="card-howto">' + esc(a.howto) + '</div>' +
      '<div class="card-body">' + bodyHTML(a, card) + '</div>' +
      answerHTML(a, card);

    elReveal.disabled = !!NO_ANSWER[a.name] || a.name === "Humdinger";
    elReveal.style.opacity = elReveal.disabled ? ".4" : "1";
    elReveal.textContent = revealed ? "Answer shown" : "Show answer";

    Array.prototype.forEach.call(elDecks.children, function(b, i){
      b.setAttribute("aria-pressed", i === di ? "true" : "false"); });
    Array.prototype.forEach.call(elActs.children, function(b, i){
      b.setAttribute("aria-pressed", i === ai ? "true" : "false"); });
  }

  function buildActs(){
    elActs.innerHTML = "";
    deck().activities.forEach(function(a, i){
      var b = document.createElement("button");
      b.className = "act-btn"; b.type = "button"; b.textContent = a.name;
      b.onclick = function(){ ai = i; draw(); };
      elActs.appendChild(b);
    });
  }

  DECKS.forEach(function(d, i){
    var b = document.createElement("button");
    b.className = "deck-btn"; b.type = "button";
    b.style.setProperty("--deck", "var(--" + SLUG[d.deck] + ")");
    b.innerHTML = '<span class="pip"></span>' + esc(d.deck);
    b.onclick = function(){ di = i; ai = 0; buildActs(); draw(); };
    elDecks.appendChild(b);
  });

  document.getElementById("next").onclick = draw;
  elReveal.onclick = function(){ if(!elReveal.disabled){ revealed = true; render(false); } };

  /* 60-second timer, same as the sand timer in the box */
  var left = 60, tick = null;
  var tval = document.getElementById("tval"), tbtn = document.getElementById("tbtn"),
      twrap = document.getElementById("timer");
  function paint(){
    tval.textContent = Math.floor(left / 60) + ":" + ("0" + (left % 60)).slice(-2);
    twrap.classList.toggle("low", left <= 10);
  }
  function toggle(){
    if(tick){ clearInterval(tick); tick = null; tbtn.textContent = "Start"; return; }
    if(left <= 0) left = 60;
    tbtn.textContent = "Stop";
    tick = setInterval(function(){
      left--; paint();
      if(left <= 0){ clearInterval(tick); tick = null; tbtn.textContent = "Reset"; }
    }, 1000);
  }
  tbtn.onclick = toggle;

  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "BUTTON" && e.key === " ") return;
    var k = e.key.toLowerCase();
    if(k === "n"){ draw(); }
    else if(k === "a"){ elReveal.click(); }
    else if(k === "t"){ toggle(); }
  });

  var total = DECKS.reduce(function(n, d){
    return n + d.activities.reduce(function(m, a){ return m + a.cards.length; }, 0); }, 0);
  document.getElementById("foot").innerHTML =
    '<b>' + total + ' cards</b> across ' + DECKS.length + ' decks. ' +
    'Each card type shuffles its own pile — you will see every card once before any repeats.';

  buildActs(); draw(); paint();
})();
</script>
