<title>Cranium 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1EEF6; --surface:#FFFFFF; --surface-2:#E8E3F0;
  --ink:#221B2E; --ink-muted:#6B6379; --hairline:#D6CFE1;
  --on-deck:#FFFFFF;
  --shadow:0 1px 2px rgba(34,27,46,.06), 0 14px 30px -14px rgba(34,27,46,.30);
  --shadow-lift:0 2px 5px rgba(34,27,46,.09), 0 28px 50px -18px rgba(34,27,46,.36);
  --worm:#A87505; --worm-wash:#FAEFD1;
  --cat:#2A5CBE;  --cat-wash:#DDE6FB;
  --data:#C93A4C; --data-wash:#FBE1E4;
  --star:#2A8039; --star-wash:#DCEFE0;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#16121F; --surface:#221B2E; --surface-2:#2E2640;
    --ink:#F0EBF7; --ink-muted:#A198B2; --hairline:#3C3350;
    --on-deck:#16121F;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 30px -14px rgba(0,0,0,.65);
    --shadow-lift:0 2px 5px rgba(0,0,0,.5), 0 28px 50px -18px rgba(0,0,0,.75);
    --worm:#EFC352; --worm-wash:#3B2F11;
    --cat:#83A8F5;  --cat-wash:#1C2946;
    --data:#F27484; --data-wash:#3E1C22;
    --star:#6FCA7E; --star-wash:#173220;
  }
}
:root[data-theme="dark"]{
  --ground:#16121F; --surface:#221B2E; --surface-2:#2E2640;
  --ink:#F0EBF7; --ink-muted:#A198B2; --hairline:#3C3350;
  --on-deck:#16121F;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 30px -14px rgba(0,0,0,.65);
  --shadow-lift:0 2px 5px rgba(0,0,0,.5), 0 28px 50px -18px rgba(0,0,0,.75);
  --worm:#EFC352; --worm-wash:#3B2F11;
  --cat:#83A8F5;  --cat-wash:#1C2946;
  --data:#F27484; --data-wash:#3E1C22;
  --star:#6FCA7E; --star-wash:#173220;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px; margin:0 auto; padding:28px 20px 64px; display:flex; flex-direction:column; gap:22px}

/* ---- masthead ---- */
.masthead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap}
.wordmark{font-family:var(--display); font-weight:800; font-size:clamp(28px,5vw,40px); letter-spacing:-.02em; margin:0; line-height:1}
.wordmark span{
  background:linear-gradient(90deg,var(--worm) 0 25%,var(--cat) 25% 50%,var(--data) 50% 75%,var(--star) 75% 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.masthead p{margin:0; color:var(--ink-muted); font-size:14px; max-width:44ch}

/* ---- deck + activity pickers ---- */
.picker{display:flex; flex-direction:column; gap:10px}
.picker-label{
  font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-muted); font-weight:600;
}
.decks{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
@media (max-width:560px){ .decks{grid-template-columns:repeat(2,1fr)} }
.deck-btn{
  font-family:var(--display); font-weight:600; font-size:15px;
  border:1.5px solid var(--hairline); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:11px 10px; cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:9px; transition:border-color .15s, background .15s;
}
.deck-btn .pip{width:11px; height:11px; border-radius:50%; background:var(--deck); flex:none}
.deck-btn:hover{border-color:var(--deck)}
.deck-btn[aria-pressed="true"]{background:var(--deck); border-color:var(--deck); color:var(--on-deck)}
.deck-btn[aria-pressed="true"] .pip{background:var(--on-deck)}

.acts{display:flex; flex-wrap:wrap; gap:7px}
.act-btn{
  font-family:var(--body); font-weight:500; font-size:13.5px;
  border:1.5px solid var(--hairline); background:transparent; color:var(--ink-muted);
  border-radius:999px; padding:6px 14px; cursor:pointer; transition:all .15s;
}
.act-btn:hover{color:var(--ink); border-color:var(--deck)}
.act-btn[aria-pressed="true"]{background:var(--deck-wash); border-color:var(--deck); color:var(--deck); font-weight:600}

/* table setup — set once per game night, not per draw */
.setup{
  background:var(--surface-2); border:1.5px solid var(--hairline); border-radius:12px;
  padding:13px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.setup-label{
  font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-muted); font-weight:600; flex:none;
}
.gens{display:flex; flex-wrap:wrap; gap:7px}
.gen-btn{
  font-family:var(--body); font-size:13.5px; cursor:pointer;
  border:1.5px solid var(--hairline); background:var(--surface); color:var(--ink-muted);
  border-radius:8px; padding:6px 12px; display:inline-flex; align-items:center; gap:8px;
  transition:all .15s;
}
.gen-btn .tick{
  width:15px; height:15px; border-radius:4px; flex:none;
  border:1.5px solid var(--hairline); display:grid; place-items:center;
  font-size:10px; line-height:1; color:transparent;
}
.gen-btn .yrs{font-size:11.5px; opacity:.65; font-variant-numeric:tabular-nums}
.gen-btn:hover{border-color:var(--ink-muted)}
.gen-btn[aria-pressed="true"]{color:var(--ink); border-color:var(--ink-muted); font-weight:600}
.gen-btn[aria-pressed="true"] .tick{
  background:var(--ink); border-color:var(--ink); color:var(--surface);
}
.setup-note{font-size:12.5px; color:var(--ink-muted); margin:0; flex:1 1 240px; min-width:0}

.empty{padding:34px 22px; display:flex; flex-direction:column; gap:9px}
.empty h2{font-family:var(--display); font-weight:600; font-size:21px; margin:0; letter-spacing:-.01em}
.empty p{margin:0; color:var(--ink-muted); font-size:14.5px; max-width:52ch; line-height:1.5}

.diffs{display:flex; flex-wrap:wrap; gap:7px}
.diff-btn{
  font-family:var(--body); font-weight:500; font-size:13.5px;
  border:1.5px solid var(--hairline); background:transparent; color:var(--ink-muted);
  border-radius:999px; padding:6px 13px; cursor:pointer; transition:all .15s;
  display:inline-flex; align-items:center; gap:7px;
}
.diff-btn:hover{color:var(--ink); border-color:var(--deck)}
.diff-btn[aria-pressed="true"]{background:var(--deck-wash); border-color:var(--deck); color:var(--deck); font-weight:600}
.diff-btn .cnt{font-variant-numeric:tabular-nums; opacity:.6; font-size:12px}
.bars{display:inline-flex; align-items:flex-end; gap:2px; height:11px}
.bars i{width:3px; border-radius:1px; background:currentColor; opacity:.28}
.bars i:nth-child(1){height:5px}
.bars i:nth-child(2){height:8px}
.bars i:nth-child(3){height:11px}
.bars i.on{opacity:1}

button:focus-visible, a:focus-visible{outline:2.5px solid var(--deck); outline-offset:2px}

/* ---- the card ---- */
.card{
  background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lift);
  overflow:hidden; display:flex; flex-direction:column; min-height:296px;
}
.card.dealing{animation:deal .34s cubic-bezier(.2,.75,.3,1)}
@keyframes deal{from{transform:translateY(14px) rotate(-.7deg); opacity:0} to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){ .card.dealing{animation:none} }

.card-band{
  background:var(--deck); color:var(--on-deck);
  padding:11px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.card-band .act{font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-.01em}
.card-band .of{
  font-size:12px; font-variant-numeric:tabular-nums; opacity:.9; font-weight:500;
  display:inline-flex; align-items:center; gap:7px; text-align:right;
}
.card-band .of .tier{text-transform:capitalize; letter-spacing:.02em}
.card-howto{
  padding:12px 22px; background:var(--deck-wash); color:var(--ink);
  font-size:13px; line-height:1.45; border-bottom:1px solid var(--hairline);
}
.card-body{padding:26px 22px; display:flex; flex-direction:column; gap:16px; flex:1; justify-content:center}

.eyebrow{
  font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--deck); font-weight:600;
}
.clue{
  font-family:var(--display); font-weight:600; letter-spacing:-.015em;
  font-size:clamp(24px,4.2vw,36px); line-height:1.18; margin:0; text-wrap:balance;
}
.clue.small{font-size:clamp(20px,3vw,27px)}
.puzzle{
  font-family:var(--mono); font-weight:500; font-size:clamp(19px,3.4vw,29px);
  line-height:1.5; word-break:break-word;
}
.sub{color:var(--ink-muted); font-size:15px; margin:0}

.options{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.options li{
  display:flex; gap:11px; align-items:flex-start;
  border:1.5px solid var(--hairline); border-radius:9px; padding:10px 13px;
  font-size:15.5px; line-height:1.35;
}
.options li .ltr{font-family:var(--mono); font-weight:500; color:var(--ink-muted); flex:none}
.options li.right{border-color:var(--deck); background:var(--deck-wash)}
.options li.right .ltr{color:var(--deck)}

.answer{
  border-top:1px dashed var(--hairline); padding:16px 22px 20px;
  display:flex; flex-direction:column; gap:5px;
}
.answer .eyebrow{color:var(--ink-muted)}
.answer .val{
  font-family:var(--display); font-weight:800; font-size:clamp(20px,3.4vw,28px);
  color:var(--deck); letter-spacing:-.01em; line-height:1.2;
}
.answer .val.mono{font-family:var(--mono); font-weight:500; font-size:clamp(17px,2.6vw,22px); letter-spacing:.04em}
.answer .note{color:var(--ink-muted); font-size:14px}

/* ---- controls ---- */
.controls{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.btn{
  font-family:var(--body); font-size:14.5px; font-weight:600;
  border-radius:10px; padding:11px 18px; cursor:pointer; border:1.5px solid transparent;
  transition:filter .15s, background .15s;
}
.btn-primary{background:var(--deck); color:var(--on-deck)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface); border-color:var(--hairline); color:var(--ink)}
.btn-ghost:hover{border-color:var(--deck)}
.timer{
  margin-left:auto; display:flex; align-items:center; gap:9px;
  background:var(--surface); border:1.5px solid var(--hairline); border-radius:10px; padding:7px 9px 7px 14px;
}
.timer .t{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:19px; font-weight:500; min-width:52px}
.timer.low .t{color:var(--cat)}
.timer .btn{padding:6px 12px; font-size:13px}
.hint{color:var(--ink-muted); font-size:12.5px; margin:0}
.hint kbd{
  font-family:var(--mono); font-size:11.5px; background:var(--surface-2);
  border-radius:4px; padding:1.5px 5px; border:1px solid var(--hairline);
}
footer{color:var(--ink-muted); font-size:13px; border-top:1px solid var(--hairline); padding-top:16px; line-height:1.6}
footer b{color:var(--ink); font-weight:600}
</style>

<div class="wrap">
  <header class="masthead">
    <h1 class="wordmark"><span>Cranium 2026</span></h1>
    <p>Draw a real Cranium card, read off its category, then play one of these instead. Same rules, references your table actually shares.</p>
  </header>

  <section class="setup">
    <span class="setup-label">Who's playing</span>
    <div class="gens" id="gens"></div>
    <p class="setup-note" id="gennote"></p>
  </section>

  <div class="picker">
    <div class="picker-label">Deck</div>
    <div class="decks" id="decks"></div>
  </div>

  <div class="picker">
    <div class="picker-label">Card type</div>
    <div class="acts" id="acts"></div>
  </div>

  <div class="picker">
    <div class="picker-label">Difficulty</div>
    <div class="diffs" id="diffs"></div>
  </div>

  <article class="card" id="card"></article>

  <div class="controls">
    <button class="btn btn-primary" id="next">Next card</button>
    <button class="btn btn-ghost" id="reveal">Show answer</button>
    <div class="timer" id="timer">
      <span class="t" id="tval">1:00</span>
      <button class="btn btn-ghost" id="tbtn">Start</button>
    </div>
  </div>
  <p class="hint"><kbd>N</kbd> next card · <kbd>A</kbd> show answer · <kbd>T</kbd> timer · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> easy, medium, hard · <kbd>0</kbd> any</p>

  <footer id="foot"></footer>
</div>

<script type="application/json" id="deckdata">__DATA__</script>
<script>
(function(){
  "use strict";
  var DECKS = JSON.parse(document.getElementById("deckdata").textContent);
  var SLUG = {"Word Worm":"worm","Creative Cat":"cat","Data Head":"data","Star Performer":"star"};
  var NO_ANSWER = {"Cloodle":1,"Sensosketch":1,"Sculptorades":1,"Cameo":1,"Copycat":1};

  var di = 0, ai = 0, diff = "all", card = null, revealed = false, bags = {};
  var GEN_LIST = [["boomer","Boomers","1946–64"], ["genx","Gen X","1965–80"],
                  ["millennial","Millennials","1981–96"], ["genz","Gen Z","1997–2012"]];
  var GEN_KEY = "cranium2026:gens";
  var gens = {boomer:true, genx:true, millennial:true, genz:true};
  try {
    var saved = JSON.parse(localStorage.getItem(GEN_KEY));
    if(saved) GEN_LIST.forEach(function(g){ gens[g[0]] = !!saved[g[0]]; });
  } catch(e) {}
  var TIERS = [["all","Any tier",0],["easy","Easy",1],["medium","Medium",2],["hard","Hard",3]];
  var LVL = {easy:1, medium:2, hard:3};
  var elDecks = document.getElementById("decks"), elActs = document.getElementById("acts"),
      elCard = document.getElementById("card"), elReveal = document.getElementById("reveal"),
      elDiffs = document.getElementById("diffs"),
      elGens = document.getElementById("gens"),
      elGenNote = document.getElementById("gennote");

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function deck(){ return DECKS[di]; }
  function act(){ return deck().activities[ai]; }
  function genList(){
    return GEN_LIST.filter(function(g){ return gens[g[0]]; }).map(function(g){ return g[0]; });
  }
  function bagKey(){ return di + "/" + ai + "/" + diff + "/" + genList().join(","); }

  /* a card plays if it's timeless, or if anyone at the table would know it */
  function fits(c){
    if(c.gens.indexOf("all") >= 0) return true;
    for(var i = 0; i < c.gens.length; i++){ if(gens[c.gens[i]]) return true; }
    return false;
  }

  /* the cards in the current deck + type + difficulty + generations, as indices */
  function pool(tier){
    var cards = act().cards, want = tier || diff, out = [];
    for(var i = 0; i < cards.length; i++){
      if((want === "all" || cards[i].difficulty === want) && fits(cards[i])) out.push(i);
    }
    return out;
  }

  function bars(n){
    var s = '<span class="bars">';
    for(var i = 1; i <= 3; i++) s += '<i class="' + (i <= n ? "on" : "") + '"></i>';
    return s + "</span>";
  }

  function draw(){
    var a = act(), key = bagKey();
    if(!bags[key] || !bags[key].length){
      var order = pool();
      for(var i = order.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1)), t = order[i];
        order[i] = order[j]; order[j] = t;
      }
      bags[key] = order;
    }
    if(!bags[key].length){ card = null; revealed = false; render(true); return; }
    card = a.cards[bags[key].pop()];
    revealed = false;
    render(true);
  }

  function bodyHTML(a, c){
    switch(a.name){
      case "Blankout":
        return '<div class="eyebrow">' + esc(c.hint) + '</div>' +
               '<div class="puzzle">' + esc(c.puzzle) + '</div>';
      case "Gnilleps":
        return '<div class="eyebrow">Spell it backwards, out loud</div>' +
               '<p class="clue">' + esc(c.word) + '</p>';
      case "Spellbound":
        return '<div class="eyebrow">Spell it, forwards</div>' +
               '<p class="clue">' + esc(c.word) + '</p>';
      case "Lexicon":
        return '<div class="eyebrow">What does it mean?</div>' +
               '<p class="clue">' + esc(c.word) + '</p>' + optionsHTML(c);
      case "Factoid":
        return '<p class="clue small">' + esc(c.q) + '</p>';
      case "Polygraph":
        return '<div class="eyebrow">True or false?</div>' +
               '<p class="clue small">' + esc(c.q) + '</p>';
      case "Selectaquest":
        return '<p class="clue small">' + esc(c.q) + '</p>' + optionsHTML(c);
      case "Humdinger":
        return '<div class="eyebrow">Hum it — no words</div>' +
               '<p class="clue">' + esc(c.clue) + '</p>' +
               '<p class="sub">' + esc(c.artist) + '</p>';
      default:
        return '<p class="clue">' + esc(c.clue) + '</p>';
    }
  }

  function optionsHTML(c){
    var letters = "ABCD";
    return '<ul class="options">' + c.options.map(function(o, i){
      var right = revealed && i === c.answer;
      return '<li class="' + (right ? "right" : "") + '">' +
             '<span class="ltr">' + letters[i] + '</span><span>' + esc(o) + '</span></li>';
    }).join("") + '</ul>';
  }

  function answerHTML(a, c){
    if(!revealed || NO_ANSWER[a.name]) return "";
    var label = "Answer", val = "", mono = false, note = "";
    switch(a.name){
      case "Blankout":    val = c.answer; break;
      case "Gnilleps":    val = c.backwards; mono = true; break;
      case "Spellbound":  val = c.word.split("").join(" "); mono = true; break;
      case "Lexicon":     val = c.options[c.answer]; break;
      case "Selectaquest":val = "ABCD"[c.answer] + " — " + c.options[c.answer]; break;
      case "Factoid":     val = c.a; break;
      case "Polygraph":   val = c.a ? "TRUE" : "FALSE"; note = c.note || ""; break;
      case "Humdinger":   return "";
      default: return "";
    }
    return '<div class="answer"><div class="eyebrow">' + label + '</div>' +
           '<div class="val' + (mono ? " mono" : "") + '">' + esc(val) + '</div>' +
           (note ? '<div class="note">' + esc(note) + '</div>' : "") + '</div>';
  }

  function render(dealt){
    var d = deck(), a = act(), key = bagKey(), poolSize = pool().length;
    buildDiffs();
    buildGens();
    document.documentElement.style.setProperty("--deck", "var(--" + SLUG[d.deck] + ")");
    document.documentElement.style.setProperty("--deck-wash", "var(--" + SLUG[d.deck] + "-wash)");

    elCard.className = "card" + (dealt ? " dealing" : "");
    if(!card){
      var off = GEN_LIST.filter(function(g){ return !gens[g[0]]; })
                        .map(function(g){ return g[1]; });
      elCard.innerHTML =
        '<div class="card-band"><span class="act">' + esc(a.name) + '</span></div>' +
        '<div class="empty"><h2>No ' + esc(a.name) + ' cards for this table</h2>' +
        '<p>Nothing in this deck matches ' +
        (diff === "all" ? "the generations you have on" : "this difficulty and generation mix") +
        (off.length ? ' — ' + esc(off.join(" and ")) + ' ' +
                      (off.length > 1 ? "are" : "is") + ' switched off.' : ".") +
        ' Turn a generation back on, or pick another difficulty or card type.</p></div>';
      elReveal.disabled = true; elReveal.style.opacity = ".4";
      Array.prototype.forEach.call(elDecks.children, function(b, i){
        b.setAttribute("aria-pressed", i === di ? "true" : "false"); });
      Array.prototype.forEach.call(elActs.children, function(b, i){
        b.setAttribute("aria-pressed", i === ai ? "true" : "false"); });
      return;
    }
    elCard.innerHTML =
      '<div class="card-band"><span class="act">' + esc(a.name) + '</span>' +
      '<span class="of">' + bars(LVL[card.difficulty]) +
      '<span class="tier">' + esc(card.difficulty) + '</span>' +
      '<span>' + (bags[key] ? bags[key].length : 0) + ' left of ' + poolSize + '</span></span></div>' +
      '<div class="card-howto">' + esc(a.howto) + '</div>' +
      '<div class="card-body">' + bodyHTML(a, card) + '</div>' +
      answerHTML(a, card);

    elReveal.disabled = !!NO_ANSWER[a.name] || a.name === "Humdinger";
    elReveal.style.opacity = elReveal.disabled ? ".4" : "1";
    elReveal.textContent = revealed ? "Answer shown" : "Show answer";

    Array.prototype.forEach.call(elDecks.children, function(b, i){
      b.setAttribute("aria-pressed", i === di ? "true" : "false"); });
    Array.prototype.forEach.call(elActs.children, function(b, i){
      b.setAttribute("aria-pressed", i === ai ? "true" : "false"); });
  }

  function buildDiffs(){
    var counts = {all:0, easy:0, medium:0, hard:0};
    act().cards.forEach(function(c){
      if(!fits(c)) return;
      counts.all++; counts[c.difficulty]++;
    });
    elDiffs.innerHTML = "";
    TIERS.forEach(function(t){
      var b = document.createElement("button");
      b.className = "diff-btn"; b.type = "button";
      b.setAttribute("aria-pressed", diff === t[0] ? "true" : "false");
      b.innerHTML = (t[2] ? bars(t[2]) : "") +
                    "<span>" + t[1] + "</span>" +
                    '<span class="cnt">' + counts[t[0]] + "</span>";
      b.onclick = function(){ diff = t[0]; draw(); };
      elDiffs.appendChild(b);
    });
  }

  function buildGens(){
    elGens.innerHTML = "";
    GEN_LIST.forEach(function(g){
      var b = document.createElement("button");
      b.className = "gen-btn"; b.type = "button";
      b.setAttribute("aria-pressed", gens[g[0]] ? "true" : "false");
      b.innerHTML = '<span class="tick">\u2713</span><span>' + g[1] + '</span>' +
                    '<span class="yrs">b. ' + g[2] + '</span>';
      b.onclick = function(){
        gens[g[0]] = !gens[g[0]];
        try { localStorage.setItem(GEN_KEY, JSON.stringify(gens)); } catch(e) {}
        buildGens(); draw();
      };
      elGens.appendChild(b);
    });
    var on = GEN_LIST.filter(function(g){ return gens[g[0]]; }).length;
    var playable = DECKS.reduce(function(n, d){
      return n + d.activities.reduce(function(m, a){
        return m + a.cards.filter(fits).length; }, 0); }, 0);
    elGenNote.textContent = on === GEN_LIST.length
      ? "All " + playable + " cards are in play. Switch off a generation to drop its references."
      : playable + " cards in play — the rest reference a generation you have switched off.";
  }

  function buildActs(){
    elActs.innerHTML = "";
    deck().activities.forEach(function(a, i){
      var b = document.createElement("button");
      b.className = "act-btn"; b.type = "button"; b.textContent = a.name;
      b.onclick = function(){ ai = i; draw(); };
      elActs.appendChild(b);
    });
  }

  DECKS.forEach(function(d, i){
    var b = document.createElement("button");
    b.className = "deck-btn"; b.type = "button";
    b.style.setProperty("--deck", "var(--" + SLUG[d.deck] + ")");
    b.innerHTML = '<span class="pip"></span>' + esc(d.deck);
    b.onclick = function(){ di = i; ai = 0; buildActs(); draw(); };
    elDecks.appendChild(b);
  });

  document.getElementById("next").onclick = draw;
  elReveal.onclick = function(){ if(!elReveal.disabled){ revealed = true; render(false); } };

  /* 60-second timer, same as the sand timer in the box */
  var left = 60, tick = null;
  var tval = document.getElementById("tval"), tbtn = document.getElementById("tbtn"),
      twrap = document.getElementById("timer");
  function paint(){
    tval.textContent = Math.floor(left / 60) + ":" + ("0" + (left % 60)).slice(-2);
    twrap.classList.toggle("low", left <= 10);
  }
  function toggle(){
    if(tick){ clearInterval(tick); tick = null; tbtn.textContent = "Start"; return; }
    if(left <= 0) left = 60;
    tbtn.textContent = "Stop";
    tick = setInterval(function(){
      left--; paint();
      if(left <= 0){ clearInterval(tick); tick = null; tbtn.textContent = "Reset"; }
    }, 1000);
  }
  tbtn.onclick = toggle;

  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "BUTTON" && e.key === " ") return;
    var k = e.key.toLowerCase();
    if(k === "n"){ draw(); }
    else if(k === "a"){ elReveal.click(); }
    else if(k === "t"){ toggle(); }
    else if(k === "0" || k === "1" || k === "2" || k === "3"){
      diff = TIERS[+k][0]; draw();
    }
  });

  var total = DECKS.reduce(function(n, d){
    return n + d.activities.reduce(function(m, a){ return m + a.cards.length; }, 0); }, 0);
  document.getElementById("foot").innerHTML =
    '<b>' + total + ' cards</b> across ' + DECKS.length + ' decks, spanning the 1960s to now. ' +
    'Anything that is not tied to a particular era stays in play whoever is at the table. ' +
    'Each deck, type and difficulty shuffles its own pile, so you will see every card in it ' +
    'once before any repeats.';

  buildGens(); buildActs(); draw(); paint();
})();
</script>
